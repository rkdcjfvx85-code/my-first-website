<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #1976d2, #42a5f5); color: #1a2433;
    }
    .card {
      width: 100%; max-width: 520px; padding: 48px 32px; text-align: center;
      background: #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }
    .emoji { font-size: 3.5rem; margin-bottom: 16px; }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #1976d2; }
    p { font-size: 1.05rem; line-height: 1.7; color: #4a5568; margin-bottom: 28px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; }
    .tags span { padding: 6px 14px; border-radius: 999px; background: #e3f2fd; color: #1565c0; font-size: 0.9rem; }
    a.btn {
      display: inline-block; padding: 14px 32px; border-radius: 12px; background: #1976d2;
      color: #fff; text-decoration: none; font-weight: 600; transition: background 0.2s;
    }
    a.btn:hover { background: #1565c0; }
    @media (max-width: 480px) {
      .card { padding: 36px 20px; }
      h1 { font-size: 1.6rem; }
      p { font-size: 0.98rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">👋</div>
    <h1>환영합니다!</h1>
    <p>Claude Code와 함께 웹 개발을 배우고 있어요.<br>이 페이지는 GitHub Pages로 배포한 나의 첫 번째 웹사이트입니다.</p>
    <div class="tags"><span>HTML</span><span>CSS</span><span>React</span><span>GitHub</span></div>
    <a class="btn" href="https://github.com/rkdcjfvx85-code/my-first-website">GitHub 저장소 보기</a>
  </main>
</body>
</html>
